name: Campaign build

# One linux/arm64 image per (commit, allocator variant), fanned out as a matrix.
# Push a branch campaign/run-* whose .campaign/matrix.json lists the entries:
#   [{"name": "fix-1", "sha": "<40-hex>", "variant": "mimalloc"}, ...]
# Every entry builds from its own sha; the run branch only carries the list.
# sccache (GHA backend) is shared by every job and every run, so a variant that
# touches one workspace crate recompiles that crate and its dependents only.

on:
  push:
    branches:
      - "campaign/run-*"

# One branch carries every dispatch: GitHub Actions caches (sccache objects,
# web/dist) are only readable from the branch that wrote them.
concurrency:
  group: campaign-build-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: nightly-2026-05-20
  BUILD_TARGET: aarch64-unknown-linux-gnu
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      webtrees: ${{ steps.plan.outputs.webtrees }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .campaign
      - id: plan
        run: |
          set -euo pipefail
          M=$(jq -c . .campaign/matrix.json)
          git init -q /tmp/r && cd /tmp/r
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          ENTRIES='[]'
          for sha in $(jq -r '.[].sha' <<<"$M" | sort -u); do
            git fetch -q --depth=1 --filter=blob:none origin "$sha"
            tree=$(git rev-parse "$sha:web")
            ENTRIES=$(jq -c --arg s "$sha" --arg t "$tree" '. + [{sha:$s,webtree:$t}]' <<<"$ENTRIES")
          done
          M=$(jq -c --argjson e "$ENTRIES" 'map(. as $x | . + {webtree: ($e[] | select(.sha==$x.sha) | .webtree)})' <<<"$M")
          WT=$(jq -c '[group_by(.webtree)[] | {webtree: .[0].webtree, sha: .[0].sha}]' <<<"$M")
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "webtrees=$WT" >> "$GITHUB_OUTPUT"
          jq . <<<"$M"

  web:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.webtrees) }}
    steps:
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: web/dist
          key: web-dist-${{ matrix.webtree }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          cd web && npm ci && npm run build && test -s dist/index.html
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: web/dist
          key: web-dist-${{ matrix.webtree }}

  build:
    name: ${{ matrix.name }}-${{ matrix.variant }}
    needs: [plan, web]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Variant settings
        id: v
        run: |
          set -euo pipefail
          case "${{ matrix.variant }}" in
            mimalloc)      P=release-study;       F="--features mimalloc";  D=distroless ;;
            mimalloc-prod) P=release-prod;        F="--features mimalloc";  D=distroless ;;
            jemalloc)      P=release-study;       F="--features jemalloc";  D=distroless ;;
            profiling)     P=release-study-debug; F="--features profiling"; D=tools ;;
            *) echo "unknown variant"; exit 1 ;;
          esac
          echo "profile=$P" >> "$GITHUB_OUTPUT"
          echo "features=$F" >> "$GITHUB_OUTPUT"
          echo "dockerfile=deploy/build/Dockerfile.study.$D.aarch64" >> "$GITHUB_OUTPUT"
          # The Pi runs a 16 KiB-page kernel; jemalloc bakes the page size in at
          # configure time and aborts when the kernel's page is larger.
          echo "JEMALLOC_SYS_WITH_LG_PAGE=14" >> "$GITHUB_ENV"
          if [ "${{ matrix.variant }}" = jemalloc ]; then
            echo "JEMALLOC_SYS_WITH_MALLOC_CONF=narenas:4,background_thread:true,dirty_decay_ms:2000,thp:never" >> "$GITHUB_ENV"
          fi

      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo fallocate -l 32G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile

      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}

      - uses: ./.github/actions/github-auth

      - name: Install build dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install --no-install-recommends \
            libssl-dev pkg-config gcc g++ cmake clang libunwind-dev unzip
          command -v aarch64-linux-gnu-gcc \
            || sudo ln -s "$(command -v gcc)" /usr/local/bin/aarch64-linux-gnu-gcc
          command -v aarch64-linux-gnu-g++ \
            || sudo ln -s "$(command -v g++)" /usr/local/bin/aarch64-linux-gnu-g++
          bash ./.github/protoc.sh

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.BUILD_TARGET }}

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-

      - uses: actions/cache/restore@v6
        with:
          path: web/dist
          key: web-dist-${{ matrix.webtree }}
          fail-on-cache-miss: true

      - name: Build binary
        run: |
          set -x
          cargo build --profile ${{ steps.v.outputs.profile }} ${{ steps.v.outputs.features }} \
            --target "$BUILD_TARGET"
          mkdir -p docker-ctx
          mv "target/$BUILD_TARGET/${{ steps.v.outputs.profile }}/openobserve" docker-ctx/openobserve
          ls -l docker-ctx/openobserve

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: docker-ctx
          file: ${{ steps.v.outputs.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:campaign-${{ matrix.name }}-${{ matrix.variant }}
            ${{ env.IMAGE }}:${{ matrix.sha }}-${{ matrix.variant }}
          labels: |
            org.opencontainers.image.revision=${{ matrix.sha }}
            ai.openobserve.study.variant=${{ matrix.variant }}
            ai.openobserve.study.profile=${{ steps.v.outputs.profile }}

      - name: Record digest
        run: |
          jq -n --arg name '${{ matrix.name }}' --arg variant '${{ matrix.variant }}' \
                --arg sha '${{ matrix.sha }}' \
                --arg pull "${IMAGE}@${{ steps.push.outputs.digest }}" \
                --arg bytes "$(stat -c %s docker-ctx/openobserve)" \
                '{name:$name, variant:$variant, sha:$sha, pull:$pull, binary_bytes:($bytes|tonumber)}' \
            | tee digest.json
          echo "### ${{ matrix.name }}-${{ matrix.variant }}: \`${IMAGE}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}-${{ matrix.variant }}
          path: digest.json
